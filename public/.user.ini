; Batas unggah untuk lampiran informasi: App\Models\Informasi::LAMPIRAN_MAKS_KB (2 MB per file)
; dan LAMPIRAN_MAKS_JUMLAH (2 file per informasi, dikirim dalam satu request).
; Dibaca oleh PHP CGI/LiteSpeed di hosting; nilai bawaan server hanya 2M / 8M.
; `php artisan serve` mengabaikan berkas ini -> gunakan `composer run serve` (lihat README).
upload_max_filesize = 3M
post_max_size = 8M
max_file_uploads = 20
